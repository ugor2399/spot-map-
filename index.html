<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Карта мест России</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="sidebar">
        <div id="sidebar-header">
            <h2>📍 Мои места</h2>
            <small>Кликни на метку, чтобы открыть карточку</small>
        </div>
        <div id="dev-panel">
            <span class="dev-label">🔧 DEV</span>
            <button class="dev-delete-btn" id="dev-delete-btn">🗑️ Удалить</button>
            <button class="dev-edit-btn" id="dev-edit-btn">✏️ Редактировать</button>
            <button class="dev-clear-btn" id="dev-clear-btn">🧹 Очистить всё</button>
            <button class="dev-close-btn" id="dev-close-btn">✖ Закрыть</button>
        </div>
        <div id="places-list"></div>
    </div>

    <div id="map-container">
        <div id="map"></div>
        <div id="controls">
            <button id="dev-toggle-btn" title="Панель разработчика">🔧</button>
            <button id="add-btn" title="Добавить место">➕</button>
            <button id="volzhsky-btn" title="Волжский">🏙️</button>
        </div>
    </div>

    <!-- Модалка пароля -->
    <div id="passwordModal" class="modal">
        <div class="modal-content">
            <h3 style="color:#e74c3c;text-align:center;">🔐 Доступ к панели</h3>
            <p style="text-align:center;color:#666;font-size:14px;margin-bottom:16px;">Введите пароль разработчика</p>
            <input type="password" id="passwordInput" placeholder="••••••" maxlength="20">
            <div class="password-error" id="passwordError">❌ Неверный пароль!</div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closePasswordModal()">Отмена</button>
                <button class="btn-unlock" onclick="checkPassword()">🔓 Войти</button>
            </div>
        </div>
    </div>

    <!-- Модалка добавления -->
    <div id="placeModal" class="modal">
        <div class="modal-content">
            <h3>Новое место</h3>
            <label>Город</label>
            <select id="placeCity">
                <option value="Волжский">🏙️ Волжский</option>
                <option value="Москва">🏛️ Москва</option>
                <option value="Санкт-Петербург">🌉 Санкт-Петербург</option>
                <option value="Казань">🕌 Казань</option>
                <option value="Сочи">🌴 Сочи</option>
                <option value="Другой">📍 Другой город</option>
            </select>
            <label>Название спота</label>
            <input type="text" id="placeName" placeholder="Например: Спот на БирМастер">
            <label>Описание</label>
            <textarea id="placeDesc" placeholder="Краткое описание..."></textarea>
            <label>Фото (можно несколько)</label>
            <div class="photo-upload" onclick="document.getElementById('photoInput').click()">
                📸 Нажми, чтобы добавить фото
            </div>
            <input type="file" id="photoInput" accept="image/*" multiple style="display:none">
            <div id="photosPreview"></div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">Отмена</button>
                <button class="btn-save" onclick="savePlace()">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- Модалка редактирования -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <h3>✏️ Редактировать место</h3>
            <label>Город</label>
            <select id="editPlaceCity">
                <option value="Волжский">🏙️ Волжский</option>
                <option value="Москва">🏛️ Москва</option>
                <option value="Санкт-Петербург">🌉 Санкт-Петербург</option>
                <option value="Казань">🕌 Казань</option>
                <option value="Сочи">🌴 Сочи</option>
                <option value="Другой">📍 Другой город</option>
            </select>
            <label>Название</label>
            <input type="text" id="editPlaceName">
            <label>Описание</label>
            <textarea id="editPlaceDesc"></textarea>
            <label>Фото</label>
            <div class="photo-upload" onclick="document.getElementById('editPhotoInput').click()">
                📸 Добавить ещё фото
            </div>
            <input type="file" id="editPhotoInput" accept="image/*" multiple style="display:none">
            <div id="editPhotosPreview"></div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeEditModal()">Отмена</button>
                <button class="btn-save" onclick="saveEditPlace()">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- Большое окно спота -->
    <div id="spotModal" class="modal">
        <div class="modal-content">
            <div class="spot-header">
                <h2 id="spotTitle">Название</h2>
                <button class="close-btn" onclick="closeSpotModal()">✖</button>
            </div>
            <div class="spot-body">
                <div class="left">
                    <div class="spot-gallery" id="spotGallery"></div>
                </div>
                <div class="right">
                    <div class="spot-info" id="spotInfo"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Лайтбокс -->
    <div id="lightbox">
        <button class="lb-close" onclick="closeLightbox()">✖</button>
        <button class="lb-nav lb-prev" onclick="lightboxNav(-1)">‹</button>
        <img id="lightboxImg" src="">
        <button class="lb-nav lb-next" onclick="lightboxNav(1)">›</button>
        <div class="lb-counter" id="lightboxCounter">1 / 1</div>
    </div>

    <!-- Яндекс.Карты API (JS!) -->
    <script src="https://api-maps.yandex.ru/2.1/?apikey=dd5dc019-ac88-481c-bfe2-e8867959dceb&lang=ru_RU" type="text/javascript"></script>
    <!-- Твой скрипт -->
    <script src="script.js"></script>
</body>
</html>
